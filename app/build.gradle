plugins { id 'com.android.application' }
android {
 namespace 'com.junliang.midibridge'
 compileSdk 35
 signingConfigs { debug { storeFile file('../signing/debug.keystore'); storePassword 'android'; keyAlias 'androiddebugkey'; keyPassword 'android' } }
